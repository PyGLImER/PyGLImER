name: pyglimer
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - cartopy
  - geographiclib
  - joblib
  - matplotlib
  - numpy
  - obspy>=1.3.1
  - pandas
  - pip
  - plotly
  - psutil
  - h5py
  - pytest
  - pytest-cov
  - scipy
  - tqdm
  - pyvista
  - ruff
  - pip:
    - global-land-mask
    - sphinx>=6
    - pydata-sphinx-theme
    - sphinx-copybutton
    - sphinx-gallery
    - -e .
