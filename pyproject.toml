[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyglimer"
version = "0.5.0"
description = "Pythonic Lithospheric Imaging using Earthquake Records"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Peter Makus", email = "makus@gfz-potsdam.de" },
    { name = "Lucas Sawade" },
]
keywords = [
    "Seismology", "Receiver Function", "Earth Sciences",
    "Lithosphere", "Imaging", "converted wave imaging",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
]
dependencies = [
    "cartopy",
    "global-land-mask",
    "geographiclib",
    "h5py",
    "joblib",
    "matplotlib",
    "numpy",
    "obspy>=1.3.1",
    "pandas",
    "plotly",
    "psutil",
    "pyvista",
    "scipy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/PyGLImER/PyGLImER"
Documentation = "https://pyglimer.github.io/PyGLImER/"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=6",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-gallery",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyglimer = [
    "data/examples/*",
    "data/plot_data/*",
    "data/velocity_models/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid comparisons
    "F7",   # syntax error in forward annotation
    "F82",  # undefined names
    "F401", # unused imports
    "F841", # unused variables
    "E711", # ==/!= None
    "E712", # ==/!= True/False
    "E713", # `not in` style
    "E714", # `is not` style
    "W605", # invalid escape sequences
]
